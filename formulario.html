<script src="https://www.google.com/recaptcha/api.js?render=6LfKOeltAAAAAI0kCJqa3Kh0ppfCEJhfsz4FdJPp"></script>
<style>
.form-voz-cliente {
  max-width: 900px;
  margin: 0 auto;
  padding: 1rem;
}
.form-voz-cliente fieldset {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  background-color: #fafafa;
}
.form-voz-cliente legend {
  font-weight: 700;
  color: #1a3a5c;
  padding: 0 0.75rem;
  font-size: 1.1rem;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1rem;
}
.form-group {
  margin-bottom: 1rem;
}
.form-group label {
  display: block;
  margin-bottom: 0.3rem;
  font-weight: 600;
  color: #333;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 0.6rem;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 1rem;
  font-family: inherit;
  box-sizing: border-box;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #c9a961;
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.2);
}
.form-group small {
  display: block;
  color: #666;
  font-size: 0.85rem;
  margin-top: 0.3rem;
}
.autocomplete-container {
  position: relative;
}
.autocomplete-sugerencias {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: white;
  border: 1px solid #ccc;
  border-top: none;
  border-radius: 0 0 6px 6px;
  max-height: 250px;
  overflow-y: auto;
  z-index: 1000;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.sugerencia-item {
  padding: 0.6rem 1rem;
  cursor: pointer;
  border-bottom: 1px solid #f0f0f0;
}
.sugerencia-item:hover {
  background: #f5f5f5;
}
.sugerencia-vacia {
  padding: 0.6rem 1rem;
  color: #999;
  font-style: italic;
}
.checkbox-group {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
}
.checkbox-group input {
  width: auto;
  margin-top: 0.3rem;
}
.form-actions {
  text-align: center;
  margin: 2rem 0;
}
.btn-enviar {
  background: #1a3a5c;
  color: white;
  border: none;
  padding: 1rem 3rem;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}
.btn-enviar:hover {
  background: #c9a961;
  color: #1a3a5c;
  transform: translateY(-2px);
}
.btn-enviar:disabled {
  background: #999;
  cursor: not-allowed;
  transform: none;
}
.form-mensaje {
  margin-top: 1rem;
  padding: 1.5rem;
  border-radius: 8px;
  text-align: center;
}
.form-mensaje.exito {
  background: #d4edda;
  border: 1px solid #c3e6cb;
  color: #155724;
}
.form-mensaje.error {
  background: #f8d7da;
  border: 1px solid #f5c6cb;
  color: #721c24;
}
@media (max-width: 768px) {
  .form-row {
    grid-template-columns: 1fr;
  }
}
</style>
<form id="form-voz-cliente" class="form-voz-cliente">

<fieldset>
<legend>📋 Datos del Usuario</legend>

<div class="form-row">
<div class="form-group">
<label for="nombres">Nombres *</label>
<input type="text" id="nombres" name="nombres" required>
</div>
<div class="form-group">
<label for="apellidos">Apellidos *</label>
<input type="text" id="apellidos" name="apellidos" required>
</div>
</div>

<div class="form-row">
<div class="form-group">
<label for="cedula">Cédula de Identidad *</label>
<input type="text" id="cedula" name="cedula" pattern="[0-9]{10}" maxlength="10" required placeholder="10 dígitos">
</div>
<div class="form-group">
<label for="telefono">Teléfono celular *</label>
<input type="tel" id="telefono" name="telefono" required placeholder="+593 99 999 9999">
</div>
</div>

<div class="form-group">
<label for="emailUsuario">Correo electrónico *</label>
<input type="email" id="emailUsuario" name="emailUsuario" required>
</div>

</fieldset>

<fieldset>
<legend>🏢 Datos de la Empresa</legend>

<div class="form-group autocomplete-container">
<label for="empresa">Nombre de la Razón Social de la Empresa *</label>
<input type="text" id="empresa" name="empresa" required autocomplete="off" placeholder="Escribe el nombre o razón social de la empresa...">
<div id="empresa-sugerencias" class="autocomplete-sugerencias"></div>
</div>

<div class="form-row">
<div class="form-group">
<label for="tipoQueja">Tipo de queja *</label>
<select id="tipoQueja" name="tipoQueja" required>
<option value="">Selecciona una opción</option>
<option value="Atención al cliente">Atención al cliente</option>
<option value="Producto o servicio">Producto o servicio</option>
<option value="Entrega o logística">Entrega o logística</option>
<option value="Facturación o cobro">Facturación o cobro</option>
<option value="Publicidad o promociones">Publicidad o promociones</option>
<option value="Garantía o postventa">Garantía o postventa</option>
<option value="Otros">Otros</option>
</select>
</div>
<div class="form-group">
<label for="fechaSuceso">Fecha del suceso *</label>
<input type="date" id="fechaSuceso" name="fechaSuceso" required>
</div>
</div>

<div class="form-row">
<div class="form-group">
<label for="pais">País *</label>
<select id="pais" name="pais" required>
<option value="">Selecciona un país</option>
<option value="Ecuador">Ecuador</option>
<option value="Colombia">Colombia</option>
<option value="Perú">Perú</option>
<option value="Chile">Chile</option>
<option value="Argentina">Argentina</option>
<option value="México">México</option>
<option value="España">España</option>
<option value="Estados Unidos">Estados Unidos</option>
<option value="Otro">Otro</option>
</select>
</div>
<div class="form-group">
<label for="ciudad">Ciudad *</label>
<input type="text" id="ciudad" name="ciudad" required>
</div>
</div>

</fieldset>

<fieldset>
<legend>📝 Detalles del Caso</legend>

<div class="form-group">
<label for="queja">Ingrese la queja o felicitación *</label>
<textarea id="queja" name="queja" rows="5" required placeholder="Describe tu experiencia con el mayor detalle posible..."></textarea>
</div>

<div class="form-group">
<label for="evidencia">Adjuntar evidencia (opcional)</label>
<input type="file" id="evidencia" name="evidencia" accept="image/*,application/pdf">
<small>Puedes adjuntar fotos o PDFs que respalden tu mensaje.</small>
</div>

<div class="form-group">
<label for="recomendacion">Emita una recomendación de cómo solucionar el inconveniente *</label>
<textarea id="recomendacion" name="recomendacion" rows="4" required placeholder="Tu propuesta de solución ayuda a la empresa a mejorar..."></textarea>
</div>

</fieldset>

<fieldset>
<legend>✅ Confirmación</legend>

<div class="form-group checkbox-group">
<input type="checkbox" id="terminos" name="terminos" required>
<label for="terminos">He leído y acepto los términos y condiciones del servicio Voz del Cliente — Visible. *</label>
</div>

<div class="form-group checkbox-group">
<input type="checkbox" id="autorizacion" name="autorizacion" required>
<label for="autorizacion">Autorizo a Voz del Cliente — Visible a compartir mis datos de contacto con la empresa seleccionada, con el único fin de gestionar esta comunicación. *</label>
</div>

</fieldset>

<div class="form-actions">
<button type="submit" id="btn-enviar" class="btn-enviar">🚀 Enviar mi voz</button>
</div>

<div id="form-mensaje" class="form-mensaje"></div>

<input type="hidden" id="recaptchaToken" name="recaptchaToken">

</form>

<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwezaqB_ke-mpxmaXdWUTWD68KUa9PUDPyS4xph4Rhc66SV2UZ2FcP5GS2hnqFKawps/exec";
var RECAPTCHA_SITE_KEY = "6LfKOeltAAAAAI0kCJqa3Kh0ppfCEJhfsz4FdJPp";

var inputEmpresa = document.getElementById('empresa');
var sugerenciasDiv = document.getElementById('empresa-sugerencias');
var timeoutId = null;

inputEmpresa.addEventListener('input', function() {
  var query = this.value.trim();
  if (timeoutId) clearTimeout(timeoutId);
  if (query.length < 3) {
    sugerenciasDiv.innerHTML = '';
    sugerenciasDiv.style.display = 'none';
    return;
  }
  timeoutId = setTimeout(function() { buscarEmpresas(query); }, 300);
});

function buscarEmpresas(query) {
  var url = APPS_SCRIPT_URL + '?accion=buscarEmpresas&q=' + encodeURIComponent(query);
  fetch(url)
    .then(function(response) { return response.json(); })
    .then(function(resultados) {
      if (resultados.length === 0) {
        sugerenciasDiv.innerHTML = '<div class="sugerencia-vacia">No se encontraron empresas</div>';
        sugerenciasDiv.style.display = 'block';
        return;
      }
      var html = '';
      for (var i = 0; i < resultados.length; i++) {
        html += '<div class="sugerencia-item" data-empresa="' + resultados[i].empresa + '">' + resultados[i].empresa + '</div>';
      }
      sugerenciasDiv.innerHTML = html;
      sugerenciasDiv.style.display = 'block';
      
      var items = document.querySelectorAll('.sugerencia-item');
      for (var j = 0; j < items.length; j++) {
        items[j].addEventListener('click', function() {
          inputEmpresa.value = this.dataset.empresa;
          sugerenciasDiv.innerHTML = '';
          sugerenciasDiv.style.display = 'none';
        });
      }
    })
    .catch(function(error) {
      console.error('Error al buscar empresas:', error);
    });
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.autocomplete-container')) {
    sugerenciasDiv.innerHTML = '';
    sugerenciasDiv.style.display = 'none';
  }
});

document.getElementById('form-voz-cliente').addEventListener('submit', function(e) {
  e.preventDefault();
  var btnEnviar = document.getElementById('btn-enviar');
  var mensajeDiv = document.getElementById('form-mensaje');
  btnEnviar.disabled = true;
  btnEnviar.textContent = '⏳ Enviando...';
  mensajeDiv.innerHTML = '';
  mensajeDiv.className = 'form-mensaje';

      // Esperar a que reCAPTCHA esté listo

function ejecutarRecaptcha() {
  // En localhost, saltar reCAPTCHA
  var esLocalhost = window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1';
  
  if (esLocalhost) {
    console.log('Modo localhost: saltando reCAPTCHA');
    enviarDatos('sin-token');
    return;
  }
  
  // En producción, cargar reCAPTCHA dinámicamente si no está
  function esperarGrecaptcha(intentos) {
    intentos = intentos || 0;
    
    if (typeof grecaptcha !== 'undefined' && grecaptcha.execute) {
      // grecaptcha está listo
      console.log('reCAPTCHA listo - generando token');
      grecaptcha.ready(function() {
        grecaptcha.execute(RECAPTCHA_SITE_KEY, {action: 'submit'}).then(function(token) {
          document.getElementById('recaptchaToken').value = token;
          enviarDatos(token);
        }).catch(function(err) {
          console.error('Error en reCAPTCHA:', err);
          enviarDatos('sin-token');
        });

      return;
    }
    
    if (intentos >= 20) {
      console.error('reCAPTCHA no cargó después de 6 segundos');
      enviarDatos('sin-token');
      return;
    }
    
    console.log('Esperando reCAPTCHA... intento ' + intentos);
    setTimeout(function() { esperarGrecaptcha(intentos + 1); }, 300);
 }
  
  esperarGrecaptcha(0);
}  
  
}    function enviarDatos(token) {
      var datos = {
        nombres: document.getElementById('nombres').value,
        apellidos: document.getElementById('apellidos').value,
        cedula: document.getElementById('cedula').value,
        telefono: document.getElementById('telefono').value,
        emailUsuario: document.getElementById('emailUsuario').value,
        empresa: document.getElementById('empresa').value,
        tipoQueja: document.getElementById('tipoQueja').value,
        fechaSuceso: document.getElementById('fechaSuceso').value,
        pais: document.getElementById('pais').value,
        ciudad: document.getElementById('ciudad').value,
        queja: document.getElementById('queja').value,
        recomendacion: document.getElementById('recomendacion').value,
        recaptchaToken: token
      };
      
      var params = [];
      for (var key in datos) {
        if (datos.hasOwnProperty(key)) {
          params.push(encodeURIComponent(key) + '=' + encodeURIComponent(datos[key]));
        }
      }
      var urlCompleta = APPS_SCRIPT_URL + '?' + params.join('&') + '&accion=enviarQueja';
      
      fetch(urlCompleta, {
        method: 'GET',
        mode: 'no-cors'
      })
      .then(function() {
        mensajeDiv.className = 'form-mensaje exito';
        mensajeDiv.innerHTML = '<h3>✅ ¡Mensaje enviado correctamente!</h3>' +
          '<p>Hemos recibido tu mensaje. Recibirás una copia en tu correo.</p>' +
          '<p>La empresa ha sido notificada y te responderá en un plazo de 72 horas hábiles.</p>';
        document.getElementById('form-voz-cliente').reset();
      })
      .catch(function(error) {
        mensajeDiv.className = 'form-mensaje error';
        mensajeDiv.innerHTML = '<h3>❌ Error al enviar</h3>' +
          '<p>Ha ocurrido un error. Por favor, inténtalo de nuevo más tarde.</p>';
        console.error('Error:', error);
      })
      .finally(function() {
        btnEnviar.disabled = false;
        btnEnviar.textContent = '🚀 Enviar mi voz';
      });
    }
    
    ejecutarRecaptcha();
});
</script>
