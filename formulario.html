<script>
// ============================================
// CONFIGURACIÓN
// ============================================
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwezaqB_ke-mpxmaXdWUTWD68KUa9PUDPyS4xph4Rhc66SV2UZ2FcP5GS2hnqFKawps/exec";
var RECAPTCHA_SITE_KEY = "6LfKOeltAAAAAI0kCJqa3Kh0ppfCEJhfsz4FdJPp";

// ============================================
// AUTOCOMPLETADO DE EMPRESAS
// ============================================
var inputEmpresa = document.getElementById('empresa');
var sugerenciasDiv = document.getElementById('empresa-sugerencias');
var timeoutId = null;

inputEmpresa.addEventListener('input', function() {
  var query = this.value.trim();
  if (timeoutId) clearTimeout(timeoutId);
  if (query.length < 3) {
    sugerenciasDiv.innerHTML = '';
    sugerenciasDiv.style.display = 'none';
    return;
  }
  timeoutId = setTimeout(function() { buscarEmpresas(query); }, 300);
});

function buscarEmpresas(query) {
  var url = APPS_SCRIPT_URL + '?accion=buscarEmpresas&q=' + encodeURIComponent(query);
  fetch(url)
    .then(function(response) { return response.json(); })
    .then(function(resultados) {
      if (resultados.length === 0) {
        sugerenciasDiv.innerHTML = '<div class="sugerencia-vacia">No se encontraron empresas</div>';
        sugerenciasDiv.style.display = 'block';
        return;
      }
      var html = '';
      for (var i = 0; i < resultados.length; i++) {
        html += '<div class="sugerencia-item" data-empresa="' + resultados[i].empresa + '">' + resultados[i].empresa + '</div>';
      }
      sugerenciasDiv.innerHTML = html;
      sugerenciasDiv.style.display = 'block';
      
      var items = document.querySelectorAll('.sugerencia-item');
      for (var j = 0; j < items.length; j++) {
        items[j].addEventListener('click', function() {
          inputEmpresa.value = this.dataset.empresa;
          sugerenciasDiv.innerHTML = '';
          sugerenciasDiv.style.display = 'none';
        });
      }
    })
    .catch(function(error) {
      console.error('Error al buscar empresas:', error);
    });
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.autocomplete-container')) {
    sugerenciasDiv.innerHTML = '';
    sugerenciasDiv.style.display = 'none';
  }
});

// ============================================
// ENVÍO DEL FORMULARIO
// ============================================
document.getElementById('form-voz-cliente').addEventListener('submit', function(e) {
  e.preventDefault();
  var btnEnviar = document.getElementById('btn-enviar');
  var mensajeDiv = document.getElementById('form-mensaje');
  btnEnviar.disabled = true;
  btnEnviar.textContent = '⏳ Enviando...';
  mensajeDiv.innerHTML = '';
  mensajeDiv.className = 'form-mensaje';

  // En localhost, saltar reCAPTCHA
  var esLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  
  if (esLocalhost) {
    console.log('Modo localhost: saltando reCAPTCHA');
    enviarDatos('sin-token');
    return;
  }

  // En producción, esperar a que grecaptcha esté disponible
  var intentos = 0;
  var maxIntentos = 20;
  
  function esperarGrecaptcha() {
    intentos++;
    
    if (typeof grecaptcha !== 'undefined' && grecaptcha.execute) {
      console.log('reCAPTCHA listo - generando token');
      grecaptcha.ready(function() {
        grecaptcha.execute(RECAPTCHA_SITE_KEY, {action: 'submit'}).then(function(token) {
          document.getElementById('recaptchaToken').value = token;
          enviarDatos(token);
        }).catch(function(err) {
          console.error('Error en reCAPTCHA:', err);
          enviarDatos('sin-token');
        });
      });
      return;
    }
    
    if (intentos >= maxIntentos) {
      console.error('reCAPTCHA no cargó después de 6 segundos');
      enviarDatos('sin-token');
      return;
    }
    
    setTimeout(esperarGrecaptcha, 300);
  }
  
  esperarGrecaptcha();
});

function enviarDatos(token) {
  var btnEnviar = document.getElementById('btn-enviar');
  var mensajeDiv = document.getElementById('form-mensaje');
  
  var datos = {
    nombres: document.getElementById('nombres').value,
    apellidos: document.getElementById('apellidos').value,
    cedula: document.getElementById('cedula').value,
    telefono: document.getElementById('telefono').value,
    emailUsuario: document.getElementById('emailUsuario').value,
    empresa: document.getElementById('empresa').value,
    tipoQueja: document.getElementById('tipoQueja').value,
    fechaSuceso: document.getElementById('fechaSuceso').value,
    pais: document.getElementById('pais').value,
    ciudad: document.getElementById('ciudad').value,
    queja: document.getElementById('queja').value,
    recomendacion: document.getElementById('recomendacion').value,
    recaptchaToken: token
  };
  
  var params = [];
  for (var key in datos) {
    if (datos.hasOwnProperty(key)) {
      params.push(encodeURIComponent(key) + '=' + encodeURIComponent(datos[key]));
    }
  }
  var urlCompleta = APPS_SCRIPT_URL + '?' + params.join('&') + '&accion=enviarQueja';
  
  fetch(urlCompleta, {
    method: 'GET',
    mode: 'no-cors'
  })
  .then(function() {
    mensajeDiv.className = 'form-mensaje exito';
    mensajeDiv.innerHTML = '<h3>✅ ¡Mensaje enviado correctamente!</h3>' +
      '<p>Hemos recibido tu mensaje. Recibirás una copia en tu correo.</p>' +
      '<p>La empresa ha sido notificada y te responderá en un plazo de 72 horas hábiles.</p>';
    document.getElementById('form-voz-cliente').reset();
  })
  .catch(function(error) {
    mensajeDiv.className = 'form-mensaje error';
    mensajeDiv.innerHTML = '<h3>❌ Error al enviar</h3>' +
      '<p>Ha ocurrido un error. Por favor, inténtalo de nuevo más tarde.</p>';
    console.error('Error:', error);
  })
  .finally(function() {
    btnEnviar.disabled = false;
    btnEnviar.textContent = '🚀 Enviar mi voz';
  });
}
</script>
