<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Inmueble - Visible Bienes Raíces</title>

<style>
.form-inmuebles { max-width: 900px; margin: 0 auto; padding: 1rem; }
.form-inmuebles fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; background-color: #fafafa; }
.form-inmuebles legend { font-weight: 700; color: #1a3a5c; padding: 0 0.75rem; font-size: 1.1rem; }
.form-inmuebles .form-group { margin-bottom: 1rem; }
.form-inmuebles label { display: block; margin-bottom: 0.3rem; font-weight: 600; color: #333; }
.form-inmuebles input, .form-inmuebles select, .form-inmuebles textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
.form-inmuebles input:focus, .form-inmuebles select:focus, .form-inmuebles textarea:focus { outline: none; border-color: #c9a961; box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.2); }
.form-inmuebles .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-inmuebles .btn-enviar { background: #1a3a5c; color: white; border: none; padding: 1rem 3rem; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; width: 100%; transition: all 0.3s ease; }
.form-inmuebles .btn-enviar:hover { background: #c9a961; color: #1a3a5c; }
.form-inmuebles .btn-enviar:disabled { background: #999; cursor: not-allowed; }
.form-mensaje { margin-top: 1rem; padding: 1.5rem; border-radius: 8px; text-align: center; }
.form-mensaje.exito { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
.form-mensaje.error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }

/* Mapa para seleccionar ubicación */
#mapa-seleccion { height: 300px; width: 100%; border-radius: 8px; border: 1px solid #ccc; margin-top: 0.5rem; z-index: 1; }

/* Botón de subida de Cloudinary */
#btn-subir-foto { background: #c9a961; padding: 0.8rem; border: none; border-radius: 6px; color: white; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 0.5rem; }
#btn-subir-foto:hover { background: #b89850; }

@media (max-width: 768px) { .form-inmuebles .form-row { grid-template-columns: 1fr; } }
</style>

<!-- Leaflet CSS y JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Cloudinary Upload Widget -->
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

</head>
<body>

<form id="form-inmuebles" class="form-inmuebles">

<fieldset>
<legend>🏠 Datos del Inmueble</legend>

<div class="form-group">
<label for="titulo">Título del Anuncio *</label>
<input type="text" id="titulo" name="titulo" required placeholder="Ej: Casa en venta en Samborondón">
</div>

<div class="form-row">
<div class="form-group">
<label for="tipo">Tipo *</label>
<select id="tipo" name="tipo" required>
<option value="">Selecciona</option>
<option value="Venta">Venta</option>
<option value="Renta">Renta</option>
<option value="Servicio">Servicio</option>
<option value="Producto">Producto</option>
</select>
</div>
<div class="form-group">
<label for="plan">Plan *</label>
<select id="plan" name="plan" required>
<option value="Basico">Básico ($2) - 1 foto</option>
<option value="Pro">Pro ($3) - Hasta 5 fotos</option>
</select>
</div>
</div>

<div class="form-row">
<div class="form-group">
<label for="precio">Precio (USD) *</label>
<input type="number" id="precio" name="precio" required placeholder="Ej: 150000">
</div>
<div class="form-group">
<label>Foto Principal *</label>
<button type="button" id="btn-subir-foto">📷 Subir Foto desde mi dispositivo</button>
<input type="hidden" id="fotos_url" name="fotos_url" required>
<div id="preview-foto" style="margin-top: 10px;"></div>
</div>
</div>

<div class="form-group">
<label for="descripcion">Descripción *</label>
<textarea id="descripcion" name="descripcion" rows="4" required placeholder="Describe las características: m², habitaciones, baños, etc."></textarea>
</div>

</fieldset>

<fieldset>
<legend>📍 Ubicación</legend>
<p style="color: #666; margin-bottom: 0.5rem;">Busca la dirección exacta o haz clic directamente en el mapa.</p>

<!-- Buscador de direcciones -->
<div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
  <input type="text" id="buscador-direccion" placeholder="Ej: Av. 9 de Octubre y Malecón, Guayaquil" style="flex: 1;">
  <button type="button" id="btn-buscar-direccion" class="btn-enviar" style="width: auto; padding: 0.6rem 1.5rem;">🔍 Buscar</button>
</div>

<div id="mapa-seleccion"></div>
<input type="hidden" id="lat" name="lat" required>
<input type="hidden" id="lon" name="lon" required>
<small id="coords-mostradas" style="display:block; margin-top:0.5rem; color:#1a3a5c; font-weight:600;"></small>
</fieldset>

<fieldset>
<legend>📞 Datos de Contacto</legend>
<div class="form-row">
<div class="form-group">
<label for="nombre_contacto">Nombre Completo *</label>
<input type="text" id="nombre_contacto" name="nombre_contacto" required>
</div>
<div class="form-group">
<label for="telefono">Teléfono / WhatsApp *</label>
<input type="tel" id="telefono" name="telefono" required placeholder="+593 99 999 9999">
</div>
</div>
<div class="form-group">
<label for="email">Correo Electrónico *</label>
<input type="email" id="email" name="email" required>
<small>Aquí te enviaremos la confirmación y los detalles de pago.</small>
</div>
</fieldset>

<button type="submit" id="btn-enviar-inmueble" class="btn-enviar">🏠 Registrar mi Inmueble</button>
<div id="form-inmuebles-mensaje" class="form-mensaje"></div>

</form>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpgKWbdwmtmYLj1z3AXm3_kUES-bLNOJSIznGT_XSNVX-PXbTHvEfnFc6b1cMOuopJRA/exec";

  // ============================================
  // WIDGET DE SUBIDA DE FOTOS (CLOUDINARY)
  // ============================================
  var myWidget = cloudinary.createUploadWidget({
    cloudName: 'uky7jd5y',            
    uploadPreset: 'inmuebles_preset', 
    sources: ['local', 'camera', 'url'],
    multiple: false,
    maxFileSize: 5000000, // 5MB
    cropping: true,
    croppingAspectRatio: 1.5
  }, (error, result) => {
    if (!error && result && result.event === "success") {
      var urlFoto = result.info.secure_url;
      document.getElementById('fotos_url').value = urlFoto;
      
      document.getElementById('preview-foto').innerHTML = 
        '<img src="' + urlFoto + '" style="max-width: 200px; border-radius: 8px; border: 2px solid #c9a961;">' +
        '<p style="font-size: 0.8rem; color: #666;">✅ Foto subida correctamente.</p>';
    }
  });

  document.getElementById('btn-subir-foto').addEventListener('click', function() {
    myWidget.open();
  }, false);

  // ============================================
  // MAPA DE SELECCIÓN DE UBICACIÓN
  // ============================================
  var mapa = L.map('mapa-seleccion').setView([-2.1709, -79.9223], 12);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(mapa);

  var marcador = null;

  mapa.on('click', function(e) {
    var lat = e.latlng.lat;
    var lon = e.latlng.lng;
    
    if (marcador) {
      marcador.setLatLng(e.latlng);
    } else {
      marcador = L.marker(e.latlng).addTo(mapa);
    }
    
    document.getElementById('lat').value = lat.toFixed(6);
    document.getElementById('lon').value = lon.toFixed(6);
    document.getElementById('coords-mostradas').innerText = '📍 Ubicación seleccionada: ' + lat.toFixed(4) + ', ' + lon.toFixed(4);
  });

  // ============================================
  // BUSCADOR DE DIRECCIONES (Nominatim)
  // ============================================
  document.getElementById('btn-buscar-direccion').addEventListener('click', function() {
    var direccion = document.getElementById('buscador-direccion').value.trim();
    if (!direccion) {
      alert('Por favor, escribe una dirección para buscar.');
      return;
    }

    var url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(direccion) + '&limit=1';

    fetch(url, {
      headers: {
        'User-Agent': 'VisibleBienesRaices/1.0 (mperezcqa@gmail.com)'
      }
    })
    .then(response => response.json())
    .then(data => {
      if (data && data.length > 0) {
        var lat = parseFloat(data[0].lat);
        var lon = parseFloat(data[0].lon);
        
        mapa.setView([lat, lon], 16);
        
        if (marcador) {
          marcador.setLatLng([lat, lon]);
        } else {
          marcador = L.marker([lat, lon]).addTo(mapa);
        }
        
        document.getElementById('lat').value = lat.toFixed(6);
        document.getElementById('lon').value = lon.toFixed(6);
        document.getElementById('coords-mostradas').innerText = '📍 Ubicación seleccionada: ' + lat.toFixed(4) + ', ' + lon.toFixed(4);
        
      } else {
        alert('No se encontró la dirección. Intenta ser más específico (incluye ciudad y país).');
      }
    })
    .catch(error => {
      console.error('Error al buscar dirección:', error);
      alert('Hubo un error al buscar la dirección. Inténtalo de nuevo.');
    });
  });

  // ============================================
  // ENVÍO DEL FORMULARIO
  // ============================================
  document.getElementById('form-inmuebles').addEventListener('submit', function(e) {
    e.preventDefault();
    
    var btnEnviar = document.getElementById('btn-enviar-inmueble');
    var mensajeDiv = document.getElementById('form-inmuebles-mensaje');
    
    if (!document.getElementById('lat').value || !document.getElementById('lon').value) {
      mensajeDiv.className = 'form-mensaje error';
      mensajeDiv.innerHTML = '❌ Por favor, selecciona una ubicación en el mapa.';
      return;
    }

    if (!document.getElementById('fotos_url').value) {
      mensajeDiv.className = 'form-mensaje error';
      mensajeDiv.innerHTML = '❌ Por favor, sube una foto del inmueble.';
      return;
    }
    
    btnEnviar.disabled = true;
    btnEnviar.textContent = '⏳ Enviando...';
    mensajeDiv.innerHTML = '';
    mensajeDiv.className = 'form-mensaje';

    var datos = {
      titulo: document.getElementById('titulo').value,
      tipo: document.getElementById('tipo').value,
      plan: document.getElementById('plan').value,
      precio: document.getElementById('precio').value,
      fotos_url: document.getElementById('fotos_url').value,
      descripcion: document.getElementById('descripcion').value,
      lat: document.getElementById('lat').value,
      lon: document.getElementById('lon').value,
      nombre_contacto: document.getElementById('nombre_contacto').value,
      telefono: document.getElementById('telefono').value,
      email: document.getElementById('email').value
    };

    var params = [];
    for (var key in datos) {
      if (datos.hasOwnProperty(key)) {
        params.push(encodeURIComponent(key) + '=' + encodeURIComponent(datos[key]));
      }
    }
    var urlCompleta = APPS_SCRIPT_URL + '?' + params.join('&') + '&accion=registrarInmueble';

    fetch(urlCompleta, {
      method: 'GET',
      mode: 'no-cors'
    })
    .then(function() {
      mensajeDiv.className = 'form-mensaje exito';
      mensajeDiv.innerHTML = '<h3>✅ ¡Anuncio enviado!</h3>' +
        '<p>Hemos recibido tu inmueble. Revisa tu correo (<strong>' + datos.email + '</strong>) para los detalles de pago.</p>' +
        '<p>Una vez verificado el pago, tu anuncio aparecerá en el mapa interactivo.</p>';
      document.getElementById('form-inmuebles').reset();
      if (marcador) { mapa.removeLayer(marcador); marcador = null; }
      document.getElementById('coords-mostradas').innerText = '';
      document.getElementById('preview-foto').innerHTML = '';
    })
    .catch(function(error) {
      mensajeDiv.className = 'form-mensaje error';
      mensajeDiv.innerHTML = '<h3>❌ Error al enviar</h3><p>Ha ocurrido un error. Por favor, inténtalo de nuevo.</p>';
      console.error('Error:', error);
    })
    .finally(function() {
      btnEnviar.disabled = false;
      btnEnviar.textContent = '🏠 Registrar mi Inmueble';
    });
  });

});
</script>

</body>
</html>
